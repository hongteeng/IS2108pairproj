{% extends "staff_base.html" %}
{% load money %}

{% block staff_content %}
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h3 mb-0">{{ title }}</h1>
    <button type="submit" form="meal-form" class="btn btn-success">Save</button>
  </div>
  <div class="card"><div class="card-body">
  <form method="post" id="meal-form">
    {% csrf_token %}
    {% for field in form %}
      <div class="mb-3">
        <label class="form-label">{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}<div class="text-danger">{{ field.errors }}</div>{% endif %}
      </div>
    {% endfor %}
    <a href="{% url 'dashboard:meal_list' %}" class="btn btn-outline-secondary">Cancel</a>
  </form>
  </div></div>
{% endblock %}
