{% extends "staff_base.html" %}

{% block staff_content %}
  <h1 class="h3 mb-3">{{ title }}</h1>
  <div class="card"><div class="card-body">
  <form method="post">
    {% csrf_token %}
    {% for field in form %}
      <div class="mb-3">
        <label class="form-label"{% if field.id_for_label %} for="{{ field.id_for_label }}"{% endif %}>{{ field.label }}</label>
        {{ field }}
        {% for error in field.errors %}<div class="small text-danger">{{ error }}</div>{% endfor %}
      </div>
    {% endfor %}
    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-success">Save</button>
      <a href="{% if menu %}{% url 'dashboard:menu_detail' menu.id %}{% else %}{% url 'dashboard:menu_list' %}{% endif %}" class="btn btn-outline-secondary">Cancel</a>
    </div>
  </form>
  </div></div>
{% endblock %}
