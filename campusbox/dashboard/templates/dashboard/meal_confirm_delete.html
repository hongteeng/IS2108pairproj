{% extends "staff_base.html" %}

{% block staff_content %}
  <h1 class="h3 mb-3">Delete {{ meal.name }}?</h1>
  {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Delete</button>
    <a href="{% url 'dashboard:meal_list' %}" class="btn btn-outline-secondary">Cancel</a>
  </form>
{% endblock %}
