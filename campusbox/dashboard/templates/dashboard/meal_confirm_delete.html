{% extends "staff_base.html" %}

{% block staff_content %}
  <h1 class="h3 mb-3">Delete {{ meal.name }}?</h1>
  {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
  <div class="card"><div class="card-body">
  <p>This removes the meal for good. To hide it from students instead, edit it and untick Active.</p>
  <form method="post" class="d-flex gap-2 m-0">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Delete</button>
    <a href="{% url 'dashboard:meal_list' %}" class="btn btn-outline-secondary">Cancel</a>
  </form>
  </div></div>
{% endblock %}
