{% extends "staff_base.html" %}
{% load money %}

{% block staff_content %}
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h3 mb-0">Weekly menus</h1>
    <a class="btn btn-success" href="{% url 'dashboard:menu_add' %}">New weekly menu</a>
  </div>
  <div class="card"><div class="card-body p-0"><div class="table-responsive">
  <table class="table align-middle mb-0">
    <thead>
      <tr>
        <th>Week starting</th>
        <th>Order cutoff</th>
        <th>Meals</th>
                <th></th>
      </tr>
    </thead>
    <tbody>
      {% for menu in menus %}
        <tr>
          <td>{{ menu.week_start|date:"D j M" }}</td>
          <td>{{ menu.order_cutoff|date:"D j M, H:i" }}</td>
          <td>{{ menu.items.count }}</td>
                    <td><div class="d-flex gap-2"><a href="{% url 'dashboard:menu_detail' menu.id %}" class="btn btn-sm btn-outline-success">Manage</a></div></td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
  </div></div></div>
{% endblock %}
