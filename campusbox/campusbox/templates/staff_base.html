{% extends "base.html" %}

{% block title %}CampusBox Staff{% endblock %}

{% block content %}
<div class="row">
  <div class="col-md-3 mb-3">
    <div class="card">
      <div class="list-group list-group-flush">
        <a class="list-group-item list-group-item-action {% if request.resolver_match.url_name == 'home' %}active{% endif %}" href="/dashboard/">Dashboard</a>
        <a class="list-group-item list-group-item-action {% if request.resolver_match.url_name in 'meal_list meal_add meal_edit meal_delete' %}active{% endif %}" href="{% url 'dashboard:meal_list' %}">Meals</a>
        <a class="list-group-item list-group-item-action {% if request.resolver_match.url_name == 'menu_list' %}active{% endif %}" href="{% url 'dashboard:menu_list' %}">Weekly menu</a>
        <a class="list-group-item list-group-item-action {% if request.resolver_match.url_name == 'inventory' %}active{% endif %}" href="{% url 'dashboard:inventory' %}">Inventory</a>
        <a class="list-group-item list-group-item-action {% if request.resolver_match.url_name == 'pickup_list' %}active{% endif %}" href="{% url 'dashboard:pickup_list' %}">Pickup points</a>
        <a class="list-group-item list-group-item-action {% if request.resolver_match.url_name == 'order_list' or request.resolver_match.url_name == 'order_detail' %}active{% endif %}" href="{% url 'dashboard:order_list' %}">Orders</a>
        <a class="list-group-item list-group-item-action {% if request.resolver_match.app_name == 'accounts' %}active{% endif %}" href="{% url 'accounts:staff_customers' %}">Customers</a>
        <a class="list-group-item list-group-item-action {% if request.resolver_match.app_name == 'reviews' %}active{% endif %}" href="{% url 'reviews:staff_reviews' %}">Reviews</a>
        <a class="list-group-item list-group-item-action {% if request.resolver_match.app_name == 'support' %}active{% endif %}" href="{% url 'support:staff_tickets' %}">Support</a>
      </div>
    </div>
  </div>
  <div class="col-md-9">
    {% block staff_content %}{% endblock %}
  </div>
</div>
{% endblock %}
