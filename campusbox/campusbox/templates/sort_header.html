<th class="text-nowrap">
  {# The sorted column is green, like the active sidebar link and filter pill #}
  <a href="?{% if sort_querystring %}{{ sort_querystring }}&amp;{% endif %}sort={% if sort == key %}-{{ key }}{% elif sort == '-'|add:key %}{{ key }}{% else %}{{ first }}{{ key }}{% endif %}"{% if sort == key or sort == '-'|add:key %} class="text-success"{% endif %}>
    {# The arrow always takes the same width, so the heading doesn't move when the sort changes #}
    {{ label }} <span class="sort-arrow{% if sort != key and sort != '-'|add:key %} text-muted fw-normal{% endif %}">{% if sort == key %}▲{% elif sort == '-'|add:key %}▼{% else %}↕{% endif %}</span>
  </a>
</th>
